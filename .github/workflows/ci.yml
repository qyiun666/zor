# 外部 CI（D-020 授权启用｜原"备而不发"转正）
# CIQ-2 切换已落地（D-027 触发点=首个 AC 用例批 #7 合入）：push/PR 默认跑 strict（M1 门禁实弹化）；
# SKIP 语义仅存于显式 default 模式（workflow_dispatch 可选，留作排障降级）；切换以 QA 复验记录为序。
name: zor-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options: [strict, default, bench]
        default: strict
jobs:
  baseline:
    runs-on: macos-14        # 与基准主机同架构(arm64)保证基准可比；Linux 待双平台校准后增补
    steps:
      - uses: actions/checkout@v4
      - name: Build zorcc (release)   # PR#5 合入后 compile 阶段注入口（seq=118 交接）
        working-directory: compiler
        run: cargo build --release
      - name: CI baseline
        env:
          MODE: ${{ github.event.inputs.mode || 'strict' }}
          ZORC_BIN: ${{ github.workspace }}/compiler/target/release/zorcc
        run: |
          case "$MODE" in
            strict) bash ci/run_ci.sh --strict ;;
            bench)  bash ci/run_ci.sh --bench ;;
            *)      bash ci/run_ci.sh ;;
          esac
      - name: Upload evidence (ci/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/logs/
          retention-days: 30

  # L2a CI-01：Linux ASAN/LSAN 零报告门禁（G-A-1）。
  # 固定 ubuntu-24.04 + clang-18.1.3；manifest／7 条 build-run 由 QA-01 提供。
  # CORE-04 落件前本 job 预期红（7 条 Box/drop 样本尚不能构建）；这是 fail-closed，
  # 不是放行信号；不得用 continue-on-error 或重跑洗绿。
  asan-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host pin preflight
        run: bash ci/run_ci.sh --asan-host-check
      - name: Manifest preflight
        run: bash ci/asan/run_asan.sh --validate-only
      - name: Build zorcc (release)
        working-directory: compiler
        run: cargo build --release
      - name: ASAN/LSAN gate (strict, 8 stages)
        env:
          ZORC_BIN: ${{ github.workspace }}/compiler/target/release/zorcc
        run: bash ci/run_ci.sh --strict --asan
      - name: Upload ASAN evidence (ci/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/logs/
          retention-days: 90
          if-no-files-found: error

  # L2b CI-01：Linux 运行期退出码门禁（E3001／E3002）。
  # 独立于 asan-linux：rc=101 只在无 sanitizer 普通构建上判；不改 baseline 七段／asan 八段。
  # CORE／QA 资产合流前本 job 预期红；这是 fail-closed，不得 continue-on-error 或重跑洗绿。
  runtime-codes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build zorcc (release)
        working-directory: compiler
        run: cargo build --release
      - name: runtime-codes gate (Linux, no sanitizers)
        env:
          ZORC_BIN: ${{ github.workspace }}/compiler/target/release/zorcc
          CC: clang-18
        run: bash ci/run_ci.sh --runtime-codes
      - name: Upload runtime-codes evidence (ci/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-codes-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/logs/
          retention-days: 90
          if-no-files-found: error
